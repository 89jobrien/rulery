decisions:
  - asks: Is this ticket eligible for expedited handling?
    default:
      kind: deny
      reasons:
        - code: no_determining_rule
          message: No rule determined an outcome.
    id: eligibility
    input_roots:
      - ticket
    title: Expedited handling
package:
  display_name: canonical-authored-form
  id: canonical-authored-form
  language_version: 1
  version: 0.1.0
semantics:
  expiry: inclusive
  invalid_facts:
    kind: reject_evaluation
  missing_facts:
    kind: preserve_unknown
  precedence:
    kind: priority_first
  timezone: UTC
