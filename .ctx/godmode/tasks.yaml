    notes: "Added crates/cli/tests/process_contract.rs, the first suite that observes a finished process rather than a library return value, plus a unit table in crates/cli/src/exit.rs. Nine tests pin the contracts the specification states but no test covered: the exit-condition matrix by observed code for thirteen command and format combinations, including analysis exit 6 and invalid invocation exit 2; stderr-only reporting with an empty stdout for every argument-parse failure; exactly one versioned envelope on stdout with empty stderr for machine formats; the documented ScenarioResultEnvelope array as test's one exception to that rule; one SARIF 2.1.0 log that is not a Rulery envelope; the rule that no read-only command writes a file, checked by comparing a sorted path-and-bytes snapshot of the fixture tree before and after each command; the safety requirement that trace persistence is opt-in, checked the same way after explain; and the normative MUST that environment variables must not change lock mode, checked by perturbing a copied lock and running with a cleared environment plus CI, CONTINUOUS_INTEGRATION, RULERY_FROZEN, and RULERY_LOCK_MODE, where Update must still tolerate the stale lock and Frozen must still report it. The new crate tests directory is the first under any workspace member, so CARGO_BIN_EXE_rulery is what makes a real process observable. Also renamed ExitStatus::AnalysisInconclusive to AnalysisIncomplete to match the exit table and the 2026-09-23 design note, which both spell it that way. Every lock was mutation-checked on a verified fresh build: breaking one exit code and forcing lock_of to ignore --frozen each fail the suite. Two findings from that check. First, Command::lock_mode in crates/cli/src/args.rs is public but has no production caller; dispatch.rs decides lock mode through its own private lock_of, so the public accessor and the shipped behaviour can drift apart unobserved. Second, target/debug/rulery was stale and did not match the working tree: it flipped Update mode to Frozen whenever CI was present, which looked like a violation of the no-implicit-CI-detection MUST, and cargo clean -p rulery-cli removed the behaviour. The fmt gate was also already red on the untracked dispatch.rs from cli9, so the previous session's clean and passing report did not hold. cargo xtask verify passes all seven gates with 109 tests."
