    notes: "rulery::tool_library_explain now drives a real pipeline: PackageAssembler with Frozen lock mode, PolicyCompiler::compile_source, vocabulary-guided conversion of the case file into typed CaseFacts, and ProductionPolicyEvaluator over a pinned policy calendar. Outcome, determining rule, policy date, hashes, reasons, conditions, and superseded rules are all read back from the returned DecisionTraceV1 rather than authored as literals, and the authored scenario expectation is compared structurally instead of by substring. The test was renamed to tool_library_explain_is_reproducible_end_to_end and its file to tests/conformance/tool_library_explain.rs because it never touched the CLI. The canonical explanation fixture, the human.rs canonical-text assertion, the specification's normative text block, and README.md were regenerated together. crates/emit/src/lib.rs:3 no longer claims the crate renders traces when it imports nothing from rulery-engine except Truth."
