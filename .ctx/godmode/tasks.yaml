  - id: cli17
    title: Support record-valued authored literals in scenario facts
    status: done
    depends_on:
      - cli15
    notes: Fixed by making the authored literal structure-preserving instead of flattening it to text. SourceOperand::Literal now carries a new SourceValue in crates/syntax/src/ast.rs with Scalar, Null, Sequence, and Mapping variants, and the parser builds it from the authored YAML instead of calling render. The compiler's literal() and the scenario bridge's new recursive decode() in src/application.rs both consume it. The bridge now handles records and lists by resolving each nested entry against the declared vocabulary type, and resolve() synthesizes TypeDeclaration::Primitive for the eleven built-in identities, which are named by identity and never declared, so date, integer, and text leaves resolve. The compiler decoder was also extended to the full scalar set and lists; a record literal remains unsupported there because CheckedType has no record variant, which is a type-system boundary rather than a literal gap. Locked in by canonical_scenario_compiles_and_passes_with_record_facts, and `rulery test examples/tool-library --frozen` now emits a passing ScenarioResultEnvelope whose trace shows the nested member.training record decoded.
    crate_name: rulery-syntax
    run: cargo nextest run -p rulery-syntax -p rulery
  - id: cli18
    title: Define the init scaffold and the fmt canonical form
    status: done
    depends_on:
      - cli9
    notes: 'Unblocked by amending the specification rather than deferring, and both commands are now implemented. Two new sections under ## CLI: "Scaffolded package" and "Canonical authored form", plus two entries in the table of contents and one added bullet in the conformance gate list. The registry stays at exactly 40 codes, so fmt reports a comment removal as a change through the existing fmt --check row of the exit matrix rather than through a diagnostic. Scaffolded package: init writes exactly the five paths Exact file layout already required, never a lock, refuses a non-empty destination, and derives the package identity from the destination directory name by lowercasing, collapsing rejected-character and hyphen runs to a single -, trimming boundary hyphens, and falling back to package. The scaffold is a valid package: rulery check on a fresh destination reports no diagnostic. Canonical authored form is defined over the parsed document rather than over the lowered source AST, so a document that omits a defaulted field keeps omitting it and fmt never inserts a field the author did not author; keys are sorted into ascending canonical-text order; indentation is two spaces with block sequences aligned to their owning key; typed booleans and numbers render unquoted while only strings that the core schema would retype are quoted; empty collections use flow form; comments are dropped, which is a change and not an error; the form is idempotent. Implementation: new crates/cli/src/canonical.rs is the emitter, new crates/cli/src/scaffold.rs holds the templates, and HostWorkflow gains scaffold, source_files, canonicalize_sources, canonicalize_file, and write_source. Scaffold templates are written in a readable order and rendered through the emitter, so a fresh scaffold is canonical by construction rather than by hand-ordering. The two rationale constants are deleted and the CommandPorts stubs now implement both commands, so run_write_command no longer reports them unavailable. fmt FILE reports canonical bytes on stdout and leaves the file untouched, matching the pre-existing output-contract table; fmt PACKAGE rewrites in place; fmt --check writes nothing and exits 1 on any difference. Two design corrections found while implementing. Authored key order was rejected because SourceValue::Mapping is a BTreeMap and has already discarded key order, so preserving it would have meant an AST change reaching rulery-syntax, rulery-compiler, and src/application.rs; sorted order is the order the AST already stores. The spec text first said canonical form was defined over the source AST, which would have forced fmt to fill in defaulted fields, so it was corrected to the parsed document before implementation. Twelve new tests, including four process-level ones that spawn the binary. cargo xtask verify passes all seven gates with 120 tests.'
    crate_name: rulery-cli
    completed: 2026-09-26
    run: cargo nextest run -p rulery-cli
  - id: cli15
    title: Make the tool-library conformance test actually evaluate
    status: done
    depends_on:
