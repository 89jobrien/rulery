    notes: Added the normative twelve-requirement list and two traceability tables to docs/specification.md under "Versioned requirement traceability", and xtask::check_requirements in xtask/src/conformance.rs, which runs inside the existing conformance gate. The gate rejects a specification that omits any of V01-V12 or S01-S09, names a verification test that does not exist in the workspace, or leaves any row not satisfied. Three unit tests cover the accept, reject, and real-specification paths. The gate is red on exactly six rows, V10 and S04/S05/S06/S07/S09, all of which trace to the cli5 analysis input-extraction gap; every other row is satisfied and every named test exists.
