  name: define-the-init-scaffold-and-the-fmt-canonical-form
  priority: P2
  status: done
  title: Define the init scaffold and the fmt canonical form
  description: 'Resolved. The specification was amended with two normative sections under ## CLI, "Scaffolded package" at docs/specification.md:3005 and "Canonical authored form" at docs/specification.md:3074, and both commands are implemented rather than deferred. crates/cli/src/scaffold.rs owns the init template and derives a package identity from the destination name; crates/cli/src/canonical.rs renders it through the emitter, so a fresh scaffold is canonical by construction. Both are covered at the process boundary by init_derives_identity_and_refuses_a_non_empty_destination, init_scaffolds_a_canonical_package_that_checks_clean, fmt_check_reports_every_noncanonical_file, and fmt_of_one_file_reports_bytes_without_rewriting in crates/cli/tests/process_contract.rs, plus unit tests in canonical::tests and scaffold::tests.'
  files:
  - crates/cli/src/scaffold.rs
  - crates/cli/src/canonical.rs
  - crates/cli/tests/process_contract.rs
  - docs/specification.md
  completed: 2026-09-28
  extra:
  - date: 2026-09-27
    type: blocker
    field: null
    value: null
    reviewed: 2026-09-28
    note: init and fmt are the only two commands the specification does not determine. The spec says init writes one human path line but pins no template bytes and no required-file list, and it defines "canonical" only as JCS JSON for hashed payloads, so a formatter would have to invent the authored-source form it enforces. Both are currently surfaced as an explicit typed unavailable error through the same exit matrix rather than fabricating content, and the rationale constants cite the spec lines at crates/cli/src/dispatch.rs. Needs a specification amendment or an explicit deferral from v0.1 before implementation.
  - date: 2026-09-28
    type: resolution
    field: null
    value: null
    reviewed: null
    note: Spec amended and both commands implemented. The blocker above no longer describes the tree; the unavailable-error path those notes referenced is gone from dispatch.
