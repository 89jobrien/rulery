- id: cli18
  name: define-the-init-scaffold-and-the-fmt-canonical-form
  priority: P2
  status: blocked
  title: Define the init scaffold and the fmt canonical form
  description: init and fmt are the only two commands the specification does not determine. The spec says init writes one human path line but pins no template bytes and no required-file list, and it defines "canonical" only as JCS JSON for hashed payloads, so a formatter would have to invent the authored-source form it enforces. Both are currently surfaced as an explicit typed unavailable error through the same exit matrix rather than fabricating content, and the rationale constants cite the spec lines at crates/cli/src/dispatch.rs. Needs a specification amendment or an explicit deferral from v0.1 before implementation.
  extra:
